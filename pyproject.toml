[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wattwise"
version = "0.1.0"
description = "Home appliance energy and ownership cost comparisons"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/wattwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
