<section class="results-panel"><div class="section-heading"><div><h2>Saved comparisons</h2><p>Shared snapshots from everyone using this app. Open one to view it or start your own copy.</p></div><button class="secondary" type="button" data-close-library>Close</button></div>{% for snapshot in snapshots %}<div class="saved-row"><a href="/shared/{{ snapshot.id }}">{{ snapshot.title }} ↗</a><span>{{ snapshot.created }} UTC</span></div>{% else %}<p>No comparisons saved yet. Save your shortlist to share the first one.</p>{% endfor %}</section>
